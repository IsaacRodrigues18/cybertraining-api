spring.application.name=cybertraining

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/cybertraining
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Security
# Segredo usado para assinar o token JWT (em produção seria uma variável de ambiente)
api.security.token.secret=${JWT_SECRET:cybertraining-tcc-secret-key-2026}